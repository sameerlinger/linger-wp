services:
  - type: web
    name: linger-wp
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: _site
    buildFilter:
      ignoredPaths:
        - oauth-provider/**

  - type: web
    name: linger-wp-oauth
    runtime: node
    plan: free
    rootDir: oauth-provider
    buildCommand: npm install
    startCommand: npm start
    previews:
      generation: "off"
    envVars:
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: LINGER_WP_DEPLOY_HOOK_URL
        sync: false
      # Folio team sign-in for the CMS (oauth-provider/cmsProxy.js).
      # CMS_SSO_SECRET must match the same var on linger-booking-engine.
      - key: CMS_SSO_SECRET
        sync: false
      # Fine-grained GitHub token: sameerlinger/linger-wp only, Contents read/write.
      - key: GITHUB_CONTENT_TOKEN
        sync: false
      - key: FOLIO_URL
        value: https://linger-booking-engine.onrender.com

previews:
  generation: automatic
  expireAfterDays: 3
