<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Linger CMS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Absolute, so /admin (no trailing slash - served as this same page)
     doesn't look for /config.yml and fail with a 404. -->
<link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
</head>
<body>
<script>window.CMS_MANUAL_INIT = true;</script>
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
<script src="https://unpkg.com/js-yaml@4/dist/js-yaml.min.js"></script>
<script>
// Starts Decap ourselves (CMS_MANUAL_INIT) so the config can depend on who's
// signed in. Everyone signs in with their Folio account (see config.yml's
// backend comment); the token linger-wp-oauth hands back carries their
// level from Folio - "full" for admins, "author" for people an admin
// ticked as "Website author" in Users & access. An "author" gets a
// trimmed CMS - no Homepage settings, Categories hidden (still needed
// behind the scenes for the property Categories picker), nothing
// deletable. This is only the menus: linger-wp-oauth refuses those saves
// for an author regardless.
(function () {
  var USER_KEY = "decap-cms-user";

  function storedSession() {
    try {
      var token = JSON.parse(localStorage.getItem(USER_KEY) || "null").token;
      // An admin's own GitHub sign-in (no "." in GitHub tokens): full access.
      if (token && token.indexOf(".") === -1) return { level: "full", github: true };
      var body = token.split(".")[0].replace(/-/g, "+").replace(/_/g, "/");
      var claims = JSON.parse(atob(body));
      return claims.typ === "session" ? claims : null;
    } catch (e) {
      return null;
    }
  }

  var session = storedSession();
  // An expired Folio sign-in would otherwise surface as a confusing "repo
  // not found" - drop it so the login button shows.
  if (!session || (!session.github && session.exp < Date.now() / 1000)) {
    try { localStorage.removeItem(USER_KEY); } catch (e) {}
    session = null;
  }
  var isAuthor = !!session && session.level !== "full";

  function trimForAuthor(config) {
    config.collections = config.collections
      .filter(function (c) { return c.name !== "homepage"; })
      .map(function (c) {
        c.delete = false;
        if (c.name === "categories") { c.hide = true; c.create = false; }
        return c;
      });
    return config;
  }

  // Absolute: /admin (no trailing slash) serves this same page.
  fetch("/admin/config.yml", { cache: "no-cache" })
    .then(function (res) { return res.text(); })
    .then(function (text) {
      var config = jsyaml.load(text);
      config.load_config_file = false;
      CMS.init({ config: isAuthor ? trimForAuthor(config) : config });
    });

  // Right after signing in, re-open with the menus that fit their level.
  if (!session) {
    var watch = setInterval(function () {
      var s = storedSession();
      if (!s) return;
      clearInterval(watch);
      if (s.level !== "full") location.reload();
    }, 1000);
  }

  // Decap's login button says "Login with GitHub" and there's no setting
  // for it; it now opens a choice of Folio (team) or GitHub (admin).
  new MutationObserver(function () {
    var buttons = document.querySelectorAll("button");
    for (var i = 0; i < buttons.length; i++) {
      var nodes = buttons[i].childNodes;
      for (var j = 0; j < nodes.length; j++) {
        if (nodes[j].nodeType === 3 && /Login with GitHub/i.test(nodes[j].textContent)) {
          nodes[j].textContent = "Sign in";
        }
      }
    }
  }).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
<script>
// Two small additions bolted on outside Decap's own app, deliberately not
// using Decap's custom-widget/preview APIs - this keeps them isolated from
// (and unable to break) the actual entry form Decap renders, at the cost of
// not being a "real" integrated field. See linger-wp memory: Folio
// (booking-engine-app) is the single source of truth for dormant status,
// not this CMS - these are read-only conveniences, not editing controls.
(function () {
  var SYNC_ENDPOINT = "https://linger-wp-oauth.onrender.com/sync-deploy";
  var DORMANT_ENDPOINT = "https://linger-booking-engine.onrender.com/api/public/dormant-properties";

  function el(tag, styles, text) {
    var e = document.createElement(tag);
    Object.assign(e.style, styles);
    if (text) e.textContent = text;
    return e;
  }

  // --- "Sync properties": forces a fresh linger-wp build/deploy so a
  // dormant toggle made in Folio shows up here without waiting for an
  // unrelated CMS edit to trigger one. ---
  function initSyncButton() {
    // Bottom-right, not top-right: Decap's own header (collection title,
    // search, "New entry"/user menu) lives up there, and a fixed overlay in
    // that corner was covering it. This isn't literally inside Decap's own
    // toolbar - that would mean writing to its internal DOM, which isn't a
    // documented extension point and could break silently on a Decap
    // update - just out of the way of it.
    var bar = el("div", {
      position: "fixed", bottom: "8px", right: "8px", zIndex: 9999,
      display: "flex", alignItems: "center", gap: "8px",
      background: "#fff", border: "1px solid #ccc", borderRadius: "6px",
      padding: "6px 10px", font: "13px sans-serif", boxShadow: "0 1px 4px rgba(0,0,0,0.15)",
    });
    var button = el("button", { cursor: "pointer" }, "Sync properties");
    var status = el("span", { color: "#666" }, "");
    bar.appendChild(button);
    bar.appendChild(status);
    document.body.appendChild(bar);

    button.addEventListener("click", function () {
      button.disabled = true;
      status.textContent = "Syncing…";
      fetch(SYNC_ENDPOINT, { method: "POST" })
        .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
        .then(function (result) {
          status.textContent = result.ok ? "Triggered — live in ~1 min" : (result.data && result.data.error) || "Failed";
        })
        .catch(function () {
          status.textContent = "Failed — check your connection";
        })
        .finally(function () {
          button.disabled = false;
          setTimeout(function () { status.textContent = ""; }, 6000);
        });
    });
  }

  // --- Dormant banner: shown while editing a property that's currently
  // dormant in Folio, since Decap has no idea (this CMS no longer stores
  // dormant status at all). ---
  function initDormantBanner() {
    var banner = el("div", {
      display: "none", position: "fixed", top: "0", left: "0", right: "0", zIndex: 9998,
      background: "#8a5a2a", color: "#fff", textAlign: "center",
      padding: "6px", font: "13px sans-serif",
    }, "Dormant — set in the booking engine's admin, not editable here.");
    document.body.appendChild(banner);

    var dormantSlugs = null; // fetched lazily, cached for the page's lifetime
    function currentEntrySlug() {
      // Decap's default hash route for editing an entry in the "pages"
      // collection: #/collections/pages/entries/<slug>
      var m = location.hash.match(/^#\/collections\/pages\/entries\/([^/?]+)/);
      return m ? decodeURIComponent(m[1]) : null;
    }
    function refresh() {
      var slug = currentEntrySlug();
      if (!slug) { banner.style.display = "none"; return; }
      var apply = function () { banner.style.display = dormantSlugs && dormantSlugs.indexOf(slug) !== -1 ? "block" : "none"; };
      if (dormantSlugs) { apply(); return; }
      fetch(DORMANT_ENDPOINT)
        .then(function (res) { return res.json(); })
        .then(function (data) { dormantSlugs = Array.isArray(data.slugs) ? data.slugs : []; apply(); })
        .catch(function () { /* fail quiet - this is an informational nicety, not core CMS function */ });
    }
    window.addEventListener("hashchange", refresh);
    refresh();
  }

  initSyncButton();
  initDormantBanner();
})();
</script>
</body>
</html>
