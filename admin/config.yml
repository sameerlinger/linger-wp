backend:
  name: github
  repo: sameerlinger/linger-wp
  branch: main
  # All sign-in and GitHub calls go through linger-wp-oauth (see
  # oauth-provider/cmsProxy.js). Its sign-in screen offers: team member ->
  # LingerApp (booking admin) account, at the "Website CMS" level an admin
  # set for them in its Users & access (Author: pages, posts, photos only;
  # Admin: everything); or
  # admin -> their own GitHub account (full access).
  base_url: https://linger-wp-oauth.onrender.com
  auth_endpoint: folio-auth
  api_root: https://linger-wp-oauth.onrender.com/github

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "properties"
    label: "Properties"
    label_singular: "Property"
    folder: "src/content"
    filter: { field: "type", value: "property" }
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Type", name: "type", widget: "hidden", default: "property" }
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "A new page's web address is made from its title when it's first saved (e.g. \"Monsoon Offers\" becomes linger.in/monsoon-offers/) and stays the same after, even if the title changes."
      - label: "Cover photo"
        name: "cover"
        widget: "image"
        required: false
        media_folder: "/src/images/{{slug}}"
        public_folder: "/images/{{slug}}"
        hint: "Shown on the homepage property grid and in the nav. Leave blank to keep using the first photo in this page's gallery."
      - label: "One-line description"
        name: "summary"
        widget: "string"
        required: false
        hint: "Shown on the homepage under this property's photo. Leave blank to show nothing."
      - label: "Location"
        name: "location"
        widget: "string"
        required: false
        hint: "Shown as a small label over this property's photo on the homepage, e.g. \"Coorg, Karnataka\". Leave blank to show nothing."
      - label: "Categories"
        name: "categories"
        widget: "relation"
        collection: "categories"
        search_fields: ["title"]
        value_field: "slug"
        display_fields: ["title"]
        multiple: true
        required: false
        hint: "Which homepage sections this property appears under (pick one or more). Manage the list of sections themselves under \"Categories\" below. Leave blank to leave this property off the homepage grid."
      - label: "Activities & features"
        name: "features"
        widget: "select"
        multiple: true
        required: false
        options:
          - { label: "Wi-Fi", value: "wifi" }
          - { label: "Hikes", value: "hikes" }
          - { label: "In-house naturalist", value: "naturalist" }
          - { label: "Farm activity", value: "farmActivity" }
          - { label: "BBQ", value: "bbq" }
          - { label: "Cycling", value: "cycling" }
        hint: "Pick what this property offers - each shows as an icon at the bottom-left of the page. Pet friendliness and driver accommodation aren't here: they come from this property's settings in LingerApp (the booking engine) and show automatically."
      - label: "\"Want to know more?\" form choices"
        name: "formEvents"
        widget: "list"
        field: { label: "Event", name: "event", widget: "string" }
        required: false
        hint: "Only for pages in the Experiences category, which get a \"Want to know more?\" form at the bottom. Leave blank to list this page's bold headings automatically; add names here to use your own list instead."
      - { label: "Search title (SEO)", name: "seo_title", widget: "string", required: false, hint: "Optional. The title Google shows, e.g. \"Homestay in Coorg with coffee estate walks | The Linger Farm\". Leave blank to build it from the title and location. Around 60 characters works best." }
      - { label: "Search description (SEO)", name: "seo_description", widget: "text", required: false, hint: "Optional. The grey text under the title in Google results. Leave blank to use the one-line description or the first paragraph. Around 150 characters works best." }
      - label: "Questions & answers (FAQ)"
        name: "faqs"
        widget: "list"
        required: false
        summary: "{{fields.question}}"
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }
        hint: "Optional. Plain questions guests ask, e.g. \"Are pets allowed?\" or \"How far is it from Bangalore?\". Shown at the bottom of the page and picked up by Google and AI assistants like ChatGPT. Answer in one or two complete sentences that make sense on their own."
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "experiences"
    label: "Experiences"
    label_singular: "Experience"
    description: "Events and experiences with a date, a partner, photos and an \"I'm interested\" form, shown on the Experiences page by category. Responses go to the Events tab in the booking engine. For a series with editions (e.g. Nature Exploration Weekends), make the series page first, then each edition with the series chosen under \"Part of\"."
    folder: "src/content"
    filter: { field: "type", value: "experience" }
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Type", name: "type", widget: "hidden", default: "experience" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "experience.njk" }
      - label: "Categories"
        name: "categories"
        widget: "relation"
        collection: "experience_categories"
        search_fields: ["title"]
        value_field: "slug"
        display_fields: ["title"]
        multiple: true
        required: false
        hint: "Which section of the Experiences page it appears in. Add or rename categories from the Experiences list (\"+ Add category\"). With none chosen it goes under \"More experiences\"."
      - { label: "Title", name: "title", widget: "string", hint: "The page heading and the name shown in the Events tab, e.g. \"Nature Exploration Weekend - Grasslands Edition\". The web address is made from it when first saved." }
      - label: "Part of (series)"
        name: "parent"
        widget: "relation"
        collection: "experiences"
        search_fields: ["title"]
        value_field: "{{slug}}"
        display_fields: ["title"]
        required: false
        hint: "Only for an edition of a series: pick the series page. It then appears under the series in the Experiences menu and on the series page. Leave blank for a standalone experience or a series page itself."
      - { label: "Partner", name: "partner", widget: "string", required: false, hint: "Who runs it with us, e.g. \"The Naturalist School\"." }
      - { label: "Date", name: "event_date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false, hint: "Leave blank if the date isn't fixed yet - the page says \"Date to be announced\"." }
      - { label: "End date", name: "event_end", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false, hint: "Only for a multi-day event." }
      - { label: "Where", name: "location", widget: "string", required: false, hint: "Place or property, e.g. \"The Timbaktu Bush Camp, Kalpavalli\"." }
      - { label: "Cover photo", name: "cover", widget: "image", required: false, media_folder: "/src/images/{{slug}}", public_folder: "/images/{{slug}}", hint: "Shown on the homepage and when the page is shared." }
      - { label: "One-line description", name: "summary", widget: "string", required: false, hint: "Shown under the photo on the homepage." }
      - label: "Photos (carousel)"
        name: "photos"
        widget: "list"
        required: false
        summary: "{{fields.src}}"
        media_folder: "/src/images/{{slug}}"
        public_folder: "/images/{{slug}}"
        fields:
          - { label: "Photo", name: "src", widget: "image", media_folder: "/src/images/{{slug}}", public_folder: "/images/{{slug}}" }
          - { label: "Describe the photo", name: "alt", widget: "string", required: false, hint: "For screen readers and search." }
      - { label: "Search title (SEO)", name: "seo_title", widget: "string", required: false }
      - { label: "Search description (SEO)", name: "seo_description", widget: "text", required: false }
      - { label: "Description", name: "body", widget: "markdown", hint: "What it is, who it's for, what's included." }

  - name: "pages"
    label: "Pages"
    label_singular: "Page"
    description: "Standalone pages such as policies, team and offers. Properties are under \"Properties\" and experiences under \"Experiences\"."
    folder: "src/content"
    filter: { field: "type", value: "page" }
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Type", name: "type", widget: "hidden", default: "page" }
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "A new page's web address is made from its title when it's first saved (e.g. \"Monsoon Offers\" becomes linger.in/monsoon-offers/) and stays the same after, even if the title changes."
      - label: "Show in menu"
        name: "navMenu"
        widget: "relation"
        collection: "menus"
        search_fields: ["title"]
        value_field: "{{slug}}"
        display_fields: ["title"]
        required: false
        hint: "Adds a link to this page in that top menu. Leave blank to keep the page out of the menus (it's still reachable by its web address). Add new menus under \"Menus\" below."
      - label: "Menu label"
        name: "menuLabel"
        widget: "string"
        required: false
        hint: "Only if the menu link should read differently from the page title, e.g. \"Offers\". Leave blank to use the title."
      - label: "Menu order"
        name: "menuOrder"
        widget: "number"
        value_type: "int"
        required: false
        hint: "Lower numbers come first within the menu (existing links use 10, 20, 30...). Leave blank to go last."
      - { label: "Search title (SEO)", name: "seo_title", widget: "string", required: false, hint: "Optional. The title Google shows, e.g. \"Homestay in Coorg with coffee estate walks | The Linger Farm\". Leave blank to build it from the title and location. Around 60 characters works best." }
      - { label: "Search description (SEO)", name: "seo_description", widget: "text", required: false, hint: "Optional. The grey text under the title in Google results. Leave blank to use the one-line description or the first paragraph. Around 150 characters works best." }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "destinations"
    label: "Destinations"
    label_singular: "Destination"
    description: "Search-friendly pages for a place or kind of stay, e.g. \"Homestays in Coorg\". Each shows an intro and cards for the properties you pick, and is linked from the footer."
    folder: "src/content"
    filter: { field: "type", value: "destination" }
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Type", name: "type", widget: "hidden", default: "destination" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "destination.njk" }
      - { label: "Title", name: "title", widget: "string", hint: "Shown as the page heading, so use the words people search for, e.g. \"Homestays in Coorg\". The web address is made from it when first saved." }
      - label: "Stays to show"
        name: "stays"
        widget: "relation"
        collection: "properties"
        search_fields: ["title"]
        value_field: "{{slug}}"
        display_fields: ["title"]
        multiple: true
        required: false
        hint: "The properties listed on this page, in this order."
      - { label: "Search title (SEO)", name: "seo_title", widget: "string", required: false, hint: "The title Google shows. Around 60 characters works best." }
      - { label: "Search description (SEO)", name: "seo_description", widget: "text", required: false, hint: "The grey text under the title in Google. Around 150 characters works best." }
      - label: "Questions & answers (FAQ)"
        name: "faqs"
        widget: "list"
        required: false
        summary: "{{fields.question}}"
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }
        hint: "Optional. Plain questions guests ask, e.g. \"Are pets allowed?\" or \"How far is it from Bangalore?\". Shown at the bottom of the page and picked up by Google and AI assistants like ChatGPT. Answer in one or two complete sentences that make sense on their own."
      - { label: "Body", name: "body", widget: "markdown", hint: "Intro text. Start with a heading like \"# Homestays in Coorg\"." }

  - name: "menus"
    label: "Menus"
    label_singular: "Menu"
    description: "Top-menu dropdowns (Reservations, About Us, ...). Add custom links to a dropdown here; pages are placed in them from the Pages list. To change where a dropdown sits in the menu, use Homepage > Menu order."
    folder: "src/content/menus"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "The dropdown's name in the top menu. Rename it freely - pages stay in it." }
      - label: "Links"
        name: "links"
        label_singular: "link"
        widget: "list"
        required: false
        summary: "{{fields.label}}"
        hint: "Extra links in this dropdown that aren't pages: an email (mailto:stay@linger.in), phone (tel:+919590050001), WhatsApp (https://wa.me/918548065772) or any web address. Pages placed in this menu are added automatically, mixed in by Order."
        fields:
          - { label: "Text shown", name: "label", widget: "string" }
          - { label: "Link", name: "url", widget: "string", hint: "e.g. mailto:stay@linger.in, tel:+919590050001, https://wa.me/918548065772, https://example.com or /blog/" }
          - { label: "Order", name: "order", widget: "number", value_type: "int", required: false, hint: "Lower comes first; pages default to 1000 unless they have their own Menu order." }

  # Property categories and experience categories are managed from inside
  # the Properties and Experiences lists ("+ Add category", "Edit"), so they
  # are hidden from the sidebar (the editors still open by their address).
  - name: "categories"
    label: "Property categories"
    label_singular: "Property category"
    hide: true
    folder: "src/content/categories"
    description: "To change the order of these on the homepage and in the menu, use Homepage > Menu order."
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Shown as the section heading on the homepage." }
      - { label: "Slug", name: "slug", widget: "string", hint: "Used internally to link properties to this section - lowercase, hyphenated, no spaces." }
      - label: "Card colour"
        name: "color"
        widget: "color"
        required: false
        hint: "Background colour of the panel behind this section's property boxes on the homepage (not the heading). Light, soft shades read best. Leave blank for plain white."

  - name: "experience_categories"
    label: "Experience categories"
    label_singular: "Experience category"
    hide: true
    folder: "src/content/experience-categories"
    description: "The sections of the Experiences page, in this Order."
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Shown as the section heading on the Experiences page." }
      - { label: "Slug", name: "slug", widget: "string", hint: "Used internally to link experiences to this section - lowercase, hyphenated, no spaces." }
      - { label: "Order", name: "order", widget: "number", value_type: "int", required: false, hint: "Lower comes first on the Experiences page." }
      - { label: "Card colour", name: "color", widget: "color", required: false, hint: "Background colour of the panel behind this section's experience boxes. Light, soft shades read best. Leave blank for plain white." }

  - name: "homepage"
    label: "Homepage"
    files:
      - name: "hero"
        label: "Homepage Hero Photos"
        file: "src/_data/heroImages.json"
        fields:
          - label: "Photos"
            name: "images"
            widget: "photogrid"
            hint: "One of these is shown at random behind the homepage headline on each visit. Add, replace, reorder or remove photos with the buttons on each one."

      - name: "menu"
        label: "Menu order"
        file: "src/_data/menu.json"
        fields:
          - label: "Top menu, left to right"
            name: "items"
            label_singular: "menu item"
            widget: "list"
            collapsed: true
            hint: "Drag to reorder. Categories appear on the homepage in this same order. A new category shows up after the last one listed here until you place it; anything removed from this list goes to the end of the menu rather than disappearing."
            types:
              - label: "Category"
                name: "category"
                widget: "object"
                summary: "Category: {{fields.category}}"
                fields:
                  - label: "Category"
                    name: "category"
                    widget: "relation"
                    collection: "categories"
                    search_fields: ["title"]
                    value_field: "slug"
                    display_fields: ["title"]
              - label: "Link"
                name: "link"
                widget: "object"
                summary: "Link: {{fields.label}}"
                fields:
                  - { label: "Name", name: "label", widget: "string" }
                  - { label: "Page address", name: "url", widget: "string", hint: "A page on this site, starting with a slash, e.g. /experiences/." }
              - label: "Menu dropdown"
                name: "menu"
                widget: "object"
                summary: "Menu: {{fields.menu}}"
                fields:
                  - label: "Menu"
                    name: "menu"
                    widget: "relation"
                    collection: "menus"
                    search_fields: ["title"]
                    value_field: "{{slug}}"
                    display_fields: ["title"]

      - name: "banner"
        label: "Offers / Announcement Banner"
        file: "src/_data/banner.json"
        fields:
          - label: "Show banner"
            name: "enabled"
            widget: "boolean"
            default: false
            hint: "Turn on to show the banner at the top of every page. Turn off to hide it without losing the text below."
          - label: "Message"
            name: "message"
            widget: "string"
            required: false
            hint: "e.g. \"Diwali special: 15% off stays booked before Oct 20.\""
          - label: "Link URL"
            name: "linkUrl"
            widget: "string"
            required: false
            hint: "Where the banner links to, e.g. https://linger.in/vacation-offer-deal/. Leave blank for plain text with no link."
          - label: "Link text"
            name: "linkText"
            widget: "string"
            required: false
            default: "Learn more"
            hint: "Only shown if Link URL is set above."

  - name: "posts"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Categories", name: "categories", widget: "list", default: [] }
      - { label: "Search title (SEO)", name: "seo_title", widget: "string", required: false, hint: "Optional. The title Google shows, e.g. \"Homestay in Coorg with coffee estate walks | The Linger Farm\". Leave blank to build it from the title and location. Around 60 characters works best." }
      - { label: "Search description (SEO)", name: "seo_description", widget: "text", required: false, hint: "Optional. The grey text under the title in Google results. Leave blank to use the one-line description or the first paragraph. Around 150 characters works best." }
      - { label: "Body", name: "body", widget: "markdown" }
