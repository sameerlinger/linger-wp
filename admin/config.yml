backend:
  name: github
  repo: sameerlinger/linger-wp
  branch: main
  # All sign-in and GitHub calls go through linger-wp-oauth (see
  # oauth-provider/cmsProxy.js). Its sign-in screen offers: team member ->
  # Folio account, only if an admin ticked "Website author" for them in
  # Folio's Users & access (then pages, blog posts and photos only); or
  # admin -> their own GitHub account (full access).
  base_url: https://linger-wp-oauth.onrender.com
  auth_endpoint: folio-auth
  api_root: https://linger-wp-oauth.onrender.com/github

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "pages"
    label: "Properties & Pages"
    folder: "src/content"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "A new page's web address is made from its title when it's first saved (e.g. \"Monsoon Offers\" becomes linger.in/monsoon-offers/) and stays the same after, even if the title changes."
      - label: "Cover photo"
        name: "cover"
        widget: "image"
        required: false
        media_folder: "/src/images/{{slug}}"
        public_folder: "/images/{{slug}}"
        hint: "Shown on the homepage property grid and in the nav. Leave blank to keep using the first photo in this page's gallery."
      - label: "One-line description"
        name: "summary"
        widget: "string"
        required: false
        hint: "Shown on the homepage under this property's photo. Leave blank to show nothing."
      - label: "Location"
        name: "location"
        widget: "string"
        required: false
        hint: "Shown as a small label over this property's photo on the homepage, e.g. \"Coorg, Karnataka\". Leave blank to show nothing."
      - label: "Categories"
        name: "categories"
        widget: "relation"
        collection: "categories"
        search_fields: ["title"]
        value_field: "slug"
        display_fields: ["title"]
        multiple: true
        required: false
        hint: "Which homepage sections this property appears under (pick one or more). Manage the list of sections themselves under \"Categories\" below. Leave blank to leave this property off the homepage grid."
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "categories"
    label: "Categories"
    folder: "src/content/categories"
    description: "To change the order of these on the homepage and in the menu, use Homepage > Menu order."
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Shown as the section heading on the homepage." }
      - { label: "Slug", name: "slug", widget: "string", hint: "Used internally to link properties to this section - lowercase, hyphenated, no spaces." }
      - label: "Card colour"
        name: "color"
        widget: "color"
        required: false
        hint: "Background colour of the panel behind this section's property boxes on the homepage (not the heading). Light, soft shades read best. Leave blank for plain white."

  - name: "homepage"
    label: "Homepage"
    files:
      - name: "hero"
        label: "Homepage Hero Photos"
        file: "src/_data/heroImages.json"
        fields:
          - label: "Photos"
            name: "images"
            widget: "list"
            hint: "One of these is shown at random behind the homepage headline on each visit. Add or remove photos here."
            field: { label: "Photo", name: "image", widget: "image" }

      - name: "menu"
        label: "Menu order"
        file: "src/_data/menu.json"
        fields:
          - label: "Top menu, left to right"
            name: "items"
            label_singular: "menu item"
            widget: "list"
            collapsed: true
            hint: "Drag to reorder. Categories appear on the homepage in this same order. A new category shows up after the last one listed here until you place it; anything removed from this list goes to the end of the menu rather than disappearing."
            types:
              - label: "Category"
                name: "category"
                widget: "object"
                summary: "Category: {{fields.category}}"
                fields:
                  - label: "Category"
                    name: "category"
                    widget: "relation"
                    collection: "categories"
                    search_fields: ["title"]
                    value_field: "slug"
                    display_fields: ["title"]
              - label: "Built-in menu"
                name: "builtin"
                widget: "object"
                summary: "Menu: {{fields.menu}}"
                fields:
                  - label: "Menu"
                    name: "menu"
                    widget: "select"
                    options:
                      - { label: "Reservations", value: "reservations" }
                      - { label: "Featured", value: "featured" }
                      - { label: "Know Us", value: "know-us" }

      - name: "banner"
        label: "Offers / Announcement Banner"
        file: "src/_data/banner.json"
        fields:
          - label: "Show banner"
            name: "enabled"
            widget: "boolean"
            default: false
            hint: "Turn on to show the banner at the top of every page. Turn off to hide it without losing the text below."
          - label: "Message"
            name: "message"
            widget: "string"
            required: false
            hint: "e.g. \"Diwali special: 15% off stays booked before Oct 20.\""
          - label: "Link URL"
            name: "linkUrl"
            widget: "string"
            required: false
            hint: "Where the banner links to, e.g. https://linger.in/vacation-offer-deal/. Leave blank for plain text with no link."
          - label: "Link text"
            name: "linkText"
            widget: "string"
            required: false
            default: "Learn more"
            hint: "Only shown if Link URL is set above."

  - name: "posts"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Categories", name: "categories", widget: "list", default: [] }
      - { label: "Body", name: "body", widget: "markdown" }
